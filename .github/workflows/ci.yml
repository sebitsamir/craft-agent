name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run checks (syntax and TypeScript types)
        run: pnpm run check

      - name: Run test suite
        run: pnpm test

      - name: CLI inspect sanity
        run: node src/cli.mjs inspect .

      - name: CLI verify sanity
        run: node src/cli.mjs verify .

      - name: CLI domains sanity
        run: node src/cli.mjs domains

      - name: CLI validate-task examples
        run: |
          node src/cli.mjs validate-task examples/film-task.json
          node src/cli.mjs validate-task examples/astronomy-task.json
